<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Human Verification</title>
  <style>
    :root { color-scheme: light; --blue:#2563eb; --ink:#172033; --muted:#667085; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:linear-gradient(145deg,#eff6ff,#f8fafc 55%,#e0e7ff);
    }
    main {
      width:min(100%,420px); background:#fff; border:1px solid #e5e7eb;
      border-radius:22px; padding:30px 24px; box-shadow:0 18px 55px #1e3a8a18;
      text-align:center;
    }
    .shield {
      width:64px;height:64px;margin:0 auto 16px;display:grid;place-items:center;
      color:var(--blue);background:#eff6ff;border-radius:20px;
    }
    h1 { font-size:25px; margin:0 0 9px; letter-spacing:-.5px; }
    .intro { color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 24px; }
    .captcha-wrap { display:flex; justify-content:center; margin:0 auto 18px; min-height:78px; }
    button {
      border:0; width:100%; border-radius:12px; padding:14px 18px; color:#fff;
      background:var(--blue); font-size:16px; font-weight:700; cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .notice { font-size:12px; line-height:1.5; color:var(--muted); margin:18px 0 0; }
    #message { min-height:20px; margin:10px 0 0; color:#b42318; font-size:13px; }
    @media (max-width:360px) { main { padding:24px 16px; } }
  </style>
  <!-- 6LcGEOgtAAAAAAkq7o7L_3bdxBh0Rh_hqFHyUlGr. -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <main>
    <div class="shield" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M12 3 19 6v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="m8.5 12 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Human Verification</h1>
    <p class="intro">Complete the security check to continue to the external destination.</p>

    <form id="verify-form" method="POST" action="/verify">
      <div class="captcha-wrap">
        <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
      </div>
      <button id="verify-button" type="submit">Verify</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="notice">After verification, you will be redirected to an external advertising link. The destination may display third-party content or ads.</p>
  </main>
  <script>
    const form = document.getElementById("verify-form");
    const button = document.getElementById("verify-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      if (typeof grecaptcha === "undefined" || !grecaptcha.getResponse()) {
        message.textContent = "Please complete the reCAPTCHA challenge first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Verifying…";
      try {
        const response = await fetch("/verify", {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" }
        });
        const result = await response.json().catch(() => ({}));
        if (response.ok && result.success && result.redirect) {
          window.location.assign(result.redirect);
          return;
        }
        message.textContent = result.error || "Verification failed. Please try again.";
        if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      } catch (_) {
        message.textContent = "Could not verify right now. Please try again.";
        if (typeof grecaptcha !== "undefined") grecaptcha.reset();
      } finally {
        button.disabled = false;
        button.textContent = "Verify";
      }
    });
  </script>
</body>
</html>
